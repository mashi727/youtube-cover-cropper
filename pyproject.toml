[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-cover-cropper"
version = "1.0.0"
description = "YouTube cover image cropper - 16:9 aspect ratio, 1280x720 JPEG output with quality control"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "mashi727"}
]
keywords = ["youtube", "thumbnail", "cover", "image", "cropper", "16:9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/mashi727/youtube-cover-cropper"
Repository = "https://github.com/mashi727/youtube-cover-cropper"
Issues = "https://github.com/mashi727/youtube-cover-cropper/issues"

[project.scripts]
youtube-cover-cropper = "youtube_cover_cropper:main"

[project.gui-scripts]
youtube-cover-cropper-gui = "youtube_cover_cropper:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["youtube_cover_cropper*"]
